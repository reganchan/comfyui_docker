services:
  comfyui:
    build:
      context: .
      target: comfyui
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    container_name: comfyui
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
        #      - PYTHONHOME=/app/python
    ports:
      - "8188:8188"
    volumes:
      - ${PWD}/custom_nodes:/home/comfy/ComfyUI/custom_nodes
      - ${PWD}/models:/home/comfy/ComfyUI/models
      - ${PWD}/input:/home/comfy/ComfyUI/input
      - ${PWD}/output:/home/comfy/ComfyUI/output
      - ${PWD}/user:/home/comfy/ComfyUI/user
      - ${PWD}/local:/home/comfy/.local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
                #    restart: unless-stopped
